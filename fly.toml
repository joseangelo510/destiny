app = "destiny-production"
primary_region = "sjc"

[build]
  # The deploy workflow supplies an immutable image digest; Fly never builds it.

[env]
  PORT = "3000"
  NODE_ENV = "production"
  ANTHROPIC_COPY_MODEL = "claude-opus-4-8"
  DESTINY_SEO_PROVIDER = "dataforseo"
  OPENAI_INFOGRAPHIC_IMAGE_MODEL = "gpt-image-2"
  OPENAI_INFOGRAPHIC_RESEARCH_MODEL = "gpt-5.6-sol"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/_next/static/build-sha.txt"
    protocol = "http"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
