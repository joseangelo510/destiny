<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebound SEO — Five concepts, full mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F2E8; --well:#EDE7D7; --card:#FBF8F1;
  --ink:#182720; --ink-soft:#42544A;
  --forest:#1E4634; --forest-deep:#143324;
  --sage:#9FBCA4; --sage-line:#CFDACB; --sage-soft:#DCE4D8; --mint:#DFEBDD; --mint-deep:#CBDCC7;
  --lime:#C9E23F; --lime-ink:#3A4A0B; --amber:#8A5A2B; --amber-soft:#F3E9DA;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E8E2D2;font-family:var(--sans);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
button:focus-visible{outline:2px solid var(--forest);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.chrome{position:sticky;top:0;z-index:60;background:#182720;color:#EFEDE4;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chrome .who{font-family:var(--serif);font-size:16px}
.chrome .who em{font-style:italic;color:#C9E23F}
.tabs{display:flex;gap:4px;background:#0F1B15;border-radius:99px;padding:4px;flex-wrap:wrap}
.tabs button{padding:7px 12px;border-radius:99px;color:#B9C4B7;font-weight:500;font-size:12.5px;white-space:nowrap}
.tabs button:hover{color:#fff}
.tabs button.on{background:#F6F2E8;color:#182720}
.vp{margin-left:auto;display:flex;gap:4px;background:#0F1B15;border-radius:99px;padding:4px}
.vp button{padding:7px 13px;border-radius:99px;color:#B9C4B7;font-size:13px;font-weight:500}
.vp button.on{background:#2C4436;color:#fff}
.concept-note{background:#EDE7D7;border-bottom:1px solid #DDD4BE;padding:9px 24px;font-size:12.5px;color:var(--ink-soft)}
.concept-note b{color:var(--ink)}
.stage{display:flex;justify-content:center;padding:26px 14px 60px}
.canvas{width:100%;max-width:1320px;background:var(--paper);border-radius:22px;box-shadow:0 20px 50px -30px rgba(24,39,32,.45);overflow:hidden;display:grid;grid-template-columns:236px 1fr;min-height:860px;transition:max-width .3s}
.stage.mobile .canvas{max-width:396px;border-radius:38px;border:8px solid #182720;grid-template-columns:1fr;min-height:0}
.stage.mobile .canvas::before{content:"";display:block;height:22px;background:linear-gradient(#fbf8f1,#F6F2E8)}

/* ===== shared vocab ===== */
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;flex:none}
.st.idea{border:1px dashed var(--sage-line);color:var(--ink-soft)}.st.idea i{border:1px solid var(--sage);background:transparent;width:6px;height:6px}
.st.draft{border:1px dashed var(--sage);color:var(--ink-soft)}.st.draft i{background:var(--sage)}
.st.approved{background:var(--mint);color:var(--forest)}.st.approved i{background:var(--forest)}
.st.sched{background:var(--mint);color:var(--forest)}.st.sched i{background:transparent;border:1.5px solid var(--forest);width:6px;height:6px}
.st.pub{border:1px solid var(--forest);color:var(--forest)}.st.pub i{background:var(--forest)}
.st.live{background:var(--lime);color:var(--lime-ink)}.st.live i{background:var(--lime-ink)}
.ev{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft)}
.ev.verified{color:var(--lime-ink);font-weight:600}
.ev.verified::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px #C9E23F33}
.ev.reported::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid var(--sage)}
.cta{background:var(--forest);color:#fff;font-weight:600;padding:10px 18px;border-radius:11px;font-size:13.5px;box-shadow:0 3px 0 var(--forest-deep);transition:transform .12s}
.cta:hover{transform:translateY(-1px)}
.cta.lime{background:var(--lime);color:var(--lime-ink);box-shadow:0 3px 0 #8FA32A}
.ghost{border:1px solid var(--sage);color:var(--forest);font-weight:600;padding:9px 16px;border-radius:11px;background:var(--card);font-size:13px}
.ghost:hover{background:var(--mint)}
.quiet-link{font-size:12.5px;color:var(--forest);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.microlabel{font-size:11.5px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em}
.panel{background:var(--card);border:1px solid var(--sage-line);border-radius:16px}
.panel-h{display:flex;align-items:baseline;gap:10px;padding:15px 18px 0;flex-wrap:wrap}
.panel-h h3{font-family:var(--serif);font-weight:600;font-size:16px}
.panel-h .sub{font-size:11.5px;color:var(--ink-soft)}
.panel-h .more{margin-left:auto;font-size:12px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.dl{font-weight:700;font-size:11.5px}.dl.up{color:var(--lime-ink)}.dl.dn{color:var(--amber)}.dl.neu{color:var(--ink-soft)}
.read{font-size:12.5px;color:var(--ink-soft)}.read b{color:var(--ink)}
.mv{display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:var(--forest);background:var(--mint);border:1px solid var(--mint-deep);border-radius:99px;padding:3px 10px;white-space:nowrap}
.mv:hover{background:var(--mint-deep)}
.mv.hot{background:var(--lime);color:var(--lime-ink);border-color:#B5CC30}
.mv.quiet{background:transparent;border-color:var(--sage-line);color:var(--ink-soft)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.stage.mobile .grid{grid-template-columns:1fr;gap:14px}
.grid>*{min-width:0}
.mday{min-width:0;overflow:hidden}
.panel{min-width:0}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:1/-1}
.stage.mobile .c4,.stage.mobile .c5,.stage.mobile .c6,.stage.mobile .c7,.stage.mobile .c8,.stage.mobile .c12{grid-column:1/-1}

/* ===== sidebar ===== */
.side{background:var(--card);border-right:1px solid var(--sage-line);padding:18px 14px 16px;display:flex;flex-direction:column;gap:4px;min-height:860px}
.stage.mobile .side{display:none}
.wordmark{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--forest);display:flex;align-items:center;gap:8px;padding:2px 8px 12px}
.wordmark .ring{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--forest);border-bottom-color:var(--lime);transform:rotate(-40deg)}
.sesspill{background:var(--forest);color:#EFF3EC;border-radius:12px;padding:11px 12px;text-align:left;margin-bottom:8px;width:100%}
.sesspill .lbl{font-size:10.5px;color:#B7CDB9;font-weight:600;display:flex;justify-content:space-between}
.sesspill .lbl .prog{display:flex;gap:3px}
.sesspill .lbl .prog i{width:14px;height:4px;border-radius:99px;background:#ffffff26}
.sesspill .lbl .prog i.now{background:#ffffff80}
.sesspill .t{font-size:13px;font-weight:600;margin-top:4px;line-height:1.3}
.sesspill .go{margin-top:8px;font-size:11.5px;color:var(--lime);font-weight:700}
.tier{font-size:10.5px;font-weight:700;color:var(--sage);letter-spacing:.04em;padding:10px 8px 4px}
.nav button{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-align:left;font-size:13px;color:var(--ink-soft)}
.nav button:hover{background:var(--mint)}
.nav button.here{background:var(--forest);color:#fff;font-weight:600}
.nav button .ct{margin-left:auto;font-size:10.5px;background:var(--lime);color:var(--lime-ink);border-radius:99px;padding:1px 7px;font-weight:700}
.nav button.here .ct{background:#ffffff26;color:#fff}
.nav button.sub{font-size:12px;padding:5px 10px 5px 22px}
.nav button.q{font-family:var(--serif);font-size:14px;color:var(--ink)}
.nav.tools button{font-size:12.5px;padding:6px 10px}
.side .bottom{margin-top:auto;padding-top:10px;border-top:1px solid var(--sage-soft);display:flex;align-items:center;gap:10px;padding-left:8px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--forest);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600}
.side .bottom small{font-size:11px;color:var(--ink-soft);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
/* loop ring nav */
.ringnav{margin:4px auto 2px;width:190px}
.ringnav svg{width:100%;display:block}
.ringnav .node{cursor:pointer}
.ringnav .node circle.bg{fill:var(--mint)}
.ringnav .node.here circle.bg{fill:var(--forest)}
.ringnav .node text{font-family:var(--sans);font-size:10px;font-weight:700;fill:var(--forest);text-anchor:middle;pointer-events:none}
.ringnav .node.here text{fill:#fff}
.ringnav .node text.ct{font-size:8px;fill:var(--lime-ink)}
/* horizon strip */
.hz{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:2px 0 4px}
.hz button{background:var(--well);border-radius:9px;padding:8px 4px;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.hz button small{display:block;font-weight:500;font-size:9.5px;opacity:.8}
.hz button.here{background:var(--forest);color:#fff}
.hz button:hover{background:var(--mint)}
.hz button.here:hover{background:var(--forest)}

/* ===== main ===== */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--sage-line);background:var(--card)}
.topbar h1{font-family:var(--serif);font-weight:500;font-size:21px}
.topbar .sub{font-size:12.5px;color:var(--ink-soft)}
.topbar .end{margin-left:auto;display:flex;gap:10px;align-items:center}
.stage.mobile .topbar{padding:12px 18px;flex-wrap:wrap}
.page{padding:20px 26px 40px;display:grid;gap:16px;align-content:start}
.stage.mobile .page{padding:14px 16px 90px}
.needs{background:var(--forest);color:#EFF3EC;border-radius:14px;padding:13px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.needs .l{font-size:10.5px;color:#B7CDB9;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.needs .t{font-size:14.5px;font-weight:600;flex:1;min-width:200px}
.needs .t small{display:block;font-weight:400;font-size:12px;color:#CFE0CC;margin-top:1px}
.needs .cta{padding:8px 16px;font-size:13px}
.needs.calm{background:var(--mint);color:var(--forest)}
.needs.calm .l{color:var(--forest)}
.needs.calm .t small{color:var(--ink-soft)}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--sage-line);padding:0 4px}
.ptabs button{font-size:13px;font-weight:600;color:var(--ink-soft);padding:9px 12px;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button.on{color:var(--forest);border-bottom-color:var(--forest)}
.ptabs button .ct{font-size:10px;background:var(--lime);color:var(--lime-ink);border-radius:99px;padding:1px 6px;margin-left:5px;font-weight:700}
.tabpane{display:none;gap:16px}
.tabpane.on{display:grid}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:99px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.mnav{display:none}
.stage.mobile .mnav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--sage-line);background:var(--card);position:sticky;bottom:0}
.mnav button{padding:10px 4px 12px;font-size:10px;color:var(--ink-soft);display:grid;gap:3px;justify-items:center;text-align:center}
.mnav button b{font-size:15px;font-weight:400}
.mnav button.here{color:var(--forest);font-weight:600}

/* ===== modules ===== */
/* session + queue (work panel) */
.work{border-radius:16px;overflow:hidden;border:1px solid var(--forest);background:var(--card);display:flex;flex-direction:column}
.work .coach{background:var(--forest);color:#EFF3EC}
.coach-h{display:flex;align-items:center;gap:10px;padding:15px 18px 0}
.coach-h .microlabel{color:#B7CDB9}
.coach-h .prog{margin-left:auto;display:flex;gap:4px}
.coach-h .prog i{width:22px;height:5px;border-radius:99px;background:#ffffff26}
.coach-h .prog i.done{background:var(--lime)}
.coach-h .prog i.now{background:#ffffff70}
.coach-body{padding:10px 18px 16px}
.coach-move{display:none}.coach-move.on{display:block}
.coach-move h2{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.25}
.coach-move .why{margin-top:7px;font-size:12.5px;color:#CFE0CC}
.coach-move .why b{color:#fff}
.coach-dn{margin-top:11px;background:#ffffff12;border-radius:11px;padding:10px 13px;font-size:12px;color:#DFEAD9}
.coach-dn b{color:#C9E23F;font-weight:600}
.coach-acts{margin-top:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.coach-acts .skip{color:#B7CDB9;font-size:12px;text-decoration:underline;text-underline-offset:3px}
.coach-fin{text-align:center;padding:12px 0 4px}
.coach-fin h2{font-family:var(--serif);font-size:21px;font-weight:500}
.coach-fin p{font-size:12.5px;color:#CFE0CC;margin-top:5px}
.coach-fin .skip{color:#B7CDB9;font-size:12px;text-decoration:underline;text-underline-offset:3px;display:inline-block;margin-top:8px}
.queue{padding:12px 18px 14px}
.queue .qh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.queue .qh .microlabel{color:var(--forest)}
.queue .qh .streak{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:11px;color:var(--ink-soft)}
.queue .qh .streak i{width:7px;height:7px;border-radius:50%;background:var(--lime)}
.queue .qh .streak i.off{background:var(--well);border:1px solid var(--sage-line)}
.qrow{display:grid;grid-template-columns:auto 1fr auto;gap:11px;padding:9px 0;border-top:1px solid var(--sage-soft);align-items:start}
.qrow:first-of-type{border-top:none}
.qrow .pri{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;margin-top:1px;background:var(--well);color:var(--ink-soft)}
.qrow.session .pri{background:var(--mint);color:var(--forest)}
.qrow.now .pri{background:var(--lime);color:var(--lime-ink)}
.qrow.done .pri{background:var(--forest);color:#fff}
.qrow.done .t{text-decoration:line-through;color:var(--ink-soft)}
.qrow .t{font-size:13px;font-weight:500;line-height:1.35}
.qrow.now .t{font-weight:600}
.qrow .m{font-size:11px;color:var(--ink-soft);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qrow .why-tag{background:var(--well);border-radius:99px;padding:1px 8px;font-weight:600}
.qrow .sess{font-size:10px;font-weight:700;color:var(--forest);background:var(--mint);border-radius:99px;padding:1px 7px}
.qfoot{margin-top:8px;font-size:11.5px;color:var(--ink-soft)}
/* pipeline */
.pipe-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--card);border:1px solid var(--sage-line);border-radius:99px;padding:6px 12px}
.chip.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.pipe.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.stage.mobile .pipe,.stage.mobile .pipe.three{grid-template-columns:1fr}
.col{background:var(--well);border-radius:14px;padding:8px;min-height:360px;min-width:0}
.stage.mobile .col{min-height:0}
.col.live{background:#F1F6DB}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.col-h b{font-size:12.5px;font-weight:700}
.col-h .ct{margin-left:auto;font-size:11px;color:var(--ink-soft);font-weight:600}
.card{background:var(--card);border:1px solid var(--sage-line);border-radius:11px;padding:9px 10px;margin-bottom:8px;font-size:12px}
.card.next{border-color:var(--forest);box-shadow:0 0 0 2px #C9E23F}
.card .t{font-weight:600;line-height:1.3}
.card .kw{font-size:11px;color:var(--ink-soft);margin-top:3px}
.card .m{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:10.5px;color:var(--ink-soft)}
.card .src{background:var(--well);border-radius:99px;padding:1px 7px;font-weight:600}
.card .pin{font-size:10px;font-weight:700;color:var(--lime-ink);background:var(--lime);border-radius:99px;padding:1px 7px}
.col .add{width:100%;text-align:left;font-size:11.5px;color:var(--forest);font-weight:600;padding:7px 8px;border-radius:8px;border:1px dashed var(--sage)}
.col .add:hover{background:var(--card)}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;color:var(--ink-soft);font-weight:600;padding:8px 14px;border-bottom:1px solid var(--sage-soft)}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--sage-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .kw{font-weight:500}.tbl .kw small{display:block;color:var(--ink-soft);font-size:10.5px;font-weight:400}
.tbl .num{font-family:var(--serif);font-weight:600;color:var(--forest);font-size:14px;white-space:nowrap}
.tbl .pg{color:var(--ink-soft);font-size:11.5px}
.tbl td.act{text-align:right;white-space:nowrap}
.tbl tr.you td{background:var(--mint)}
.gap{background:var(--amber-soft);color:var(--amber);font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 8px}
.thin{background:var(--well);color:var(--ink-soft);font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 8px}
.stage.mobile .tbl th:nth-child(3),.stage.mobile .tbl td:nth-child(3){display:none}
/* clusters */
.cluster{background:var(--card);border:1px solid var(--sage-line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.cluster>button{width:100%;display:flex;align-items:center;gap:12px;padding:13px 16px;text-align:left}
.cluster>button:hover{background:var(--mint)}
.cluster .nm{font-family:var(--serif);font-weight:600;font-size:15px}
.cluster .cov{font-size:11.5px;color:var(--ink-soft)}
.cluster .bar{flex:1;max-width:160px;height:6px;border-radius:99px;background:var(--well);position:relative;margin-left:auto}
.cluster .bar i{position:absolute;inset:0;width:var(--w);background:var(--forest);border-radius:99px}
.cluster .chev{color:var(--sage);font-size:11px;transition:transform .2s}
.cluster.open .chev{transform:rotate(90deg)}
.cluster .body{display:none;border-top:1px solid var(--sage-soft)}
.cluster.open .body{display:block}
/* lists */
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--sage-soft);align-items:center;font-size:13px}
.lrow:first-child{border-top:none}
.lrow .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700}
.lrow .ic.new{background:var(--mint);color:var(--forest)}.lrow .ic.beat{background:var(--amber-soft);color:var(--amber)}.lrow .ic.edge{background:var(--lime);color:var(--lime-ink)}.lrow .ic.pace{background:var(--well);color:var(--ink-soft)}.lrow .ic.drop{background:var(--amber-soft);color:var(--amber)}.lrow .ic.opp{background:var(--lime);color:var(--lime-ink)}.lrow .ic.day{background:var(--well);color:var(--ink-soft);font-size:9.5px;width:auto;padding:0 7px;border-radius:8px;height:22px}
.lrow .t{font-weight:500}.lrow .t small{display:block;color:var(--ink-soft);font-size:11px;font-weight:400;margin-top:1px}
.lrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lrow.auto .t{color:var(--ink-soft)}
.lrow.done .t{text-decoration:line-through;color:var(--ink-soft)}
.pad{padding:6px 18px 14px}
/* reach */
.piece{background:var(--card);border:1px solid var(--sage-line);border-radius:16px;overflow:hidden}
.piece .ph{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--sage-soft);flex-wrap:wrap}
.piece .ph b{font-family:var(--serif);font-weight:600;font-size:15px}
.piece .ph .sub{font-size:11.5px;color:var(--ink-soft)}
.piece .ph .st{margin-left:auto}
.chan{display:grid;grid-template-columns:repeat(4,1fr)}
.stage.mobile .chan{grid-template-columns:1fr 1fr}
.ch{padding:12px 16px;border-right:1px solid var(--sage-soft)}
.ch:last-child{border-right:none}
.stage.mobile .ch{border-right:none;border-top:1px solid var(--sage-soft)}
.ch .cn{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;display:flex;justify-content:space-between}
.ch .it{font-size:12.5px;padding:5px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ch .it small{color:var(--ink-soft);font-size:10.5px;display:block}
/* calendar */
.mcal-head{display:flex;align-items:center;gap:12px;padding:14px 18px 0}
.mcal-head .mo{font-family:var(--serif);font-weight:600;font-size:15px}
.mcal-head .navb{color:var(--ink-soft);font-size:13px;padding:2px 7px;border-radius:6px}
.mcal-head .vw{margin-left:auto;display:flex;gap:4px;background:var(--well);border-radius:99px;padding:3px}
.mcal-head .vw button{font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:99px;color:var(--ink-soft)}
.mcal-head .vw button.on{background:var(--forest);color:#fff}
.mcal-legend{display:flex;gap:12px;font-size:10.5px;color:var(--ink-soft);padding:8px 18px 0;flex-wrap:wrap}
.mcal-legend span{display:inline-flex;align-items:center;gap:5px}
.mcal-legend i{width:8px;height:8px;border-radius:3px}
.mcal-legend .you i{background:var(--forest)}.mcal-legend .auto i{border:1.5px dashed var(--sage)}.mcal-legend .veri i{background:var(--lime)}.mcal-legend .open i{border:1.5px dashed var(--lime-ink)}
.mcal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:10px 12px 14px;gap:3px}
.mcal-dow{font-size:10.5px;font-weight:600;color:var(--ink-soft);text-align:center;padding:4px 0}
.mday{min-height:84px;border-radius:10px;padding:5px 6px;background:var(--paper);border:1px solid transparent;position:relative}
.mday.out{opacity:.38}
.mday .dn2{font-size:10.5px;font-weight:600;color:var(--ink-soft)}
.mday.today{background:var(--mint);border-color:var(--mint-deep)}
.mday.today .dn2{color:var(--forest)}
.mday .plus{position:absolute;right:5px;top:3px;font-size:12px;color:var(--sage);font-weight:700;opacity:.7}
.mday:hover .plus{color:var(--forest);opacity:1}
.mev{margin-top:3px;font-size:9.5px;line-height:1.25;border-radius:5px;padding:2px 5px;background:var(--forest);color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mev.auto{background:transparent;border:1px dashed var(--sage);color:var(--ink-soft);font-weight:400}
.mev.veri{background:var(--lime);color:var(--lime-ink)}
.mev.milestone{background:var(--well);color:var(--ink);border:1px solid var(--sage-line)}
.mev.open{background:transparent;border:1.5px dashed var(--lime-ink);color:var(--lime-ink);font-weight:700}
.stage.mobile .mcal-grid{display:none}
.mcal-agenda{display:none;padding:8px 18px 14px}
.stage.mobile .mcal-agenda{display:block}
.mcal-agenda .ar{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--sage-line);font-size:12.5px;align-items:center}
.mcal-agenda .ar:first-child{border-top:none}
.mcal-agenda .ad{width:58px;flex:none;font-weight:600;color:var(--ink-soft);font-size:11.5px}
.mcal-agenda .ar .st,.mcal-agenda .ar .ev,.mcal-agenda .ar .mv{margin-left:auto}
.cadence .r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--sage-soft);font-size:12.5px;align-items:center}
.cadence .r:first-child{border-top:none}
.cadence .r small{display:block;color:var(--ink-soft);font-size:11px}
/* plan 90 */
.phases{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--sage-line);border-radius:12px;overflow:hidden;background:var(--paper)}
.stage.mobile .phases{grid-template-columns:1fr}
.ph2{padding:12px 14px;border-right:1px solid var(--sage-line)}
.ph2:last-child{border-right:none}
.ph2.now{background:var(--mint)}
.ph2 .rng{font-size:11px;color:var(--ink-soft);font-weight:600}
.ph2 .nm{font-family:var(--serif);font-size:15px;font-weight:600;margin-top:2px}
.ph2 .pr{margin-top:8px;height:5px;border-radius:99px;background:var(--well);overflow:hidden}
.ph2 .pr i{display:block;height:100%;background:var(--forest)}
/* source boxes */
.twobox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stage.mobile .twobox{grid-template-columns:1fr}
.cbox{border:1px solid var(--sage-line);border-radius:14px;background:var(--paper);display:flex;flex-direction:column;min-height:250px}
.cbox.off{border-style:dashed;border-color:var(--sage)}
.cb-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0}
.cb-h b{font-family:var(--serif);font-weight:600;font-size:15px}
.cb-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px 4px}
.cb-kpi .n{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--forest);line-height:1.1}
.cb-kpi .l{font-size:11px;color:var(--ink-soft);margin-top:2px}
.cb-kpi .d{font-size:11px;font-weight:600;margin-top:2px;color:var(--lime-ink)}
.cb-chart{flex:1;display:flex;flex-direction:column;padding:6px 14px 12px;min-height:0}
.cb-chart svg{width:100%;flex:1;min-height:70px;display:block}
.cb-cap{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);margin-top:4px}
.cb-empty{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px;padding:16px 20px 20px}
.cb-empty p{font-size:13.5px;color:var(--ink-soft);max-width:44ch;line-height:1.6}
.cb-empty small{font-size:11px;color:var(--ink-soft)}
/* rankings shape */
.rk-row{display:grid;grid-template-columns:52px 1fr 48px;gap:10px;align-items:center;padding:4px 0;font-size:12px}
.rk-row .b{height:14px;border-radius:5px;background:var(--well);position:relative}
.rk-row .b i{position:absolute;inset:0;width:var(--w);background:var(--sage);border-radius:5px}
.rk-row.hot .b i{background:var(--forest)}.rk-row.top .b i{background:var(--lime)}
.rk-row .lab{color:var(--ink-soft);font-weight:600;font-size:11px}
.rk-row .ct{text-align:right;font-weight:600}
/* article */
.art{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
.stage.mobile .art{grid-template-columns:1fr}
.doc{background:var(--card);border:1px solid var(--sage-line);border-radius:16px;padding:28px 32px 32px}
.stage.mobile .doc{padding:20px 18px}
.doc .kicker{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-soft)}
.doc h2{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;margin-top:10px;letter-spacing:-.01em}
.stage.mobile .doc h2{font-size:22px}
.doc .meta{margin-top:8px;font-size:12px;color:var(--ink-soft)}
.doc .body{margin-top:20px;font-family:var(--serif);font-size:16px;line-height:1.7}
.doc .body h4{font-weight:600;font-size:18px;margin:22px 0 6px}
.doc .body p{margin-bottom:12px;max-width:62ch}
.doc .body .more{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);border-top:1px dashed var(--sage-line);padding-top:12px;margin-top:8px}
.doc .body .il{background:#F1F6DB;border-bottom:2px solid var(--lime);padding:0 2px}
.rail{display:grid;gap:14px}
.rail .act{background:var(--forest);color:#EFF3EC;border-radius:16px;padding:16px 18px}
.rail .act .microlabel{color:#B7CDB9}
.rail .act h3{font-family:var(--serif);font-weight:500;font-size:18px;margin:6px 0 8px;line-height:1.3}
.rail .act p{font-size:12.5px;color:#CFE0CC}
.rail .act .btns{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.rail .act .after{margin-top:12px;background:#ffffff12;border-radius:10px;padding:9px 12px;font-size:12px;color:#DFEAD9}
.rail .act .after b{color:#C9E23F}
.rail .blk{background:var(--card);border:1px solid var(--sage-line);border-radius:14px;padding:13px 16px}
.rail .blk h4{font-family:var(--serif);font-weight:600;font-size:14px;margin-bottom:8px}
.rail .row{display:flex;gap:10px;justify-content:space-between;font-size:12.5px;padding:6px 0;border-top:1px solid var(--sage-soft);align-items:center}
.rail .row:first-of-type{border-top:none}
.rail .row small{color:var(--ink-soft);display:block;font-size:11px}
.rail .chk{display:flex;gap:9px;align-items:baseline;font-size:12.5px;padding:5px 0}
.rail .chk .box{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--sage);flex:none;transform:translateY(2px)}
.rail .chk .box.ok{background:var(--forest);border-color:var(--forest);position:relative}
.rail .chk .box.ok::after{content:"✓";color:#fff;font-size:9px;position:absolute;inset:0;display:grid;place-items:center}
/* short answer */
.short{background:var(--card);border:1px solid var(--sage-line);border-left:4px solid var(--lime);border-radius:14px;padding:14px 18px;font-family:var(--serif);font-size:17px;line-height:1.4}
.short b{color:var(--forest);font-weight:600}
.short small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-soft);margin-top:4px}
/* home injected */
.homewrap{padding:0}

/* ===== HOME = approved dashboard (v5), scoped ===== */
.homewrap .st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:99px;white-space:nowrap}
.homewrap .st i{width:7px;height:7px;border-radius:50%;flex:none}
.homewrap .st.draft{border:1px dashed var(--sage);color:var(--ink-soft)}
.homewrap .st.draft i{background:var(--sage)}
.homewrap .st.approved{background:var(--mint);color:var(--forest)}
.homewrap .st.approved i{background:var(--forest)}
.homewrap .st.sched{background:var(--mint);color:var(--forest)}
.homewrap .st.sched i{background:transparent;border:1.5px solid var(--forest);width:6px;height:6px}
.homewrap .st.pub{border:1px solid var(--forest);color:var(--forest)}
.homewrap .st.pub i{background:var(--forest)}
.homewrap .st.live{background:var(--lime);color:var(--lime-ink)}
.homewrap .st.live i{background:var(--lime-ink)}
.homewrap .ev{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft)}
.homewrap .ev.verified{color:var(--lime-ink);font-weight:600}
.homewrap .ev.verified::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px #C9E23F33}
.homewrap .ev.reported::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid var(--sage)}
.homewrap .cta{background:var(--forest);color:#fff;font-weight:600;padding:10px 18px;border-radius:11px;font-size:13.5px;box-shadow:0 3px 0 var(--forest-deep);transition:transform .12s}
.homewrap .cta:hover{transform:translateY(-1px)}
.homewrap .cta:active{transform:translateY(1px);box-shadow:0 1px 0 var(--forest-deep)}
.homewrap .cta.lime{background:var(--lime);color:var(--lime-ink);box-shadow:0 3px 0 #8FA32A}
.homewrap .quiet-link{font-size:12.5px;color:var(--forest);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.homewrap .microlabel{font-size:11.5px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em}
.homewrap .panel{background:var(--card);border:1px solid var(--sage-line);border-radius:16px}
.homewrap .panel-h{display:flex;align-items:baseline;gap:10px;padding:15px 18px 0;flex-wrap:wrap}
.homewrap .panel-h h3{font-family:var(--serif);font-weight:600;font-size:16px}
.homewrap .panel-h .sub{font-size:11.5px;color:var(--ink-soft)}
.homewrap .panel-h .more{margin-left:auto;font-size:12px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.homewrap .dl{font-weight:700;font-size:11.5px}
.homewrap .dl.up{color:var(--lime-ink)}
.homewrap .dl.dn{color:var(--amber)}
.homewrap .dl.neu{color:var(--ink-soft)}
.homewrap .read{font-size:12.5px;color:var(--ink-soft)}
.homewrap .read b{color:var(--ink)}
.homewrap .dash{padding:24px 28px 46px;display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.stage.mobile .homewrap .dash{padding:18px 16px 26px;grid-template-columns:1fr;gap:14px}
.homewrap .greet{grid-column:1/-1;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.homewrap .greet h1{font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:-.01em}
.stage.mobile .homewrap .greet h1{font-size:20px}
.homewrap .greet .since{font-size:13px;color:var(--ink-soft)}
.homewrap .greet .since b{color:var(--ink);font-weight:600}
.homewrap .greet .since .win{color:var(--lime-ink);font-weight:600}
.homewrap .c5{grid-column:span 5}
.homewrap .c7{grid-column:span 7}
.homewrap .c12{grid-column:1/-1}
.stage.mobile .homewrap .c5,.stage.mobile .homewrap .c7,.stage.mobile .homewrap .c12{grid-column:1/-1}
.homewrap .work{border-radius:16px;overflow:hidden;border:1px solid var(--forest);background:var(--card);display:flex;flex-direction:column}
.homewrap .work .coach{background:var(--forest);color:#EFF3EC}
.homewrap .coach-h{display:flex;align-items:center;gap:10px;padding:15px 18px 0}
.homewrap .coach-h .microlabel{color:#B7CDB9}
.homewrap .coach-h .prog{margin-left:auto;display:flex;gap:4px}
.homewrap .coach-h .prog i{width:22px;height:5px;border-radius:99px;background:#ffffff26}
.homewrap .coach-h .prog i.done{background:var(--lime)}
.homewrap .coach-h .prog i.now{background:#ffffff70}
.homewrap .coach-body{padding:10px 18px 16px}
.homewrap .coach-move{display:none}
.homewrap .coach-move.on{display:block}
.homewrap .coach-move h2{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.25}
.homewrap .coach-move .why{margin-top:7px;font-size:12.5px;color:#CFE0CC}
.homewrap .coach-move .why b{color:#fff}
.homewrap .coach-dn{margin-top:11px;background:#ffffff12;border-radius:11px;padding:10px 13px;font-size:12px;color:#DFEAD9}
.homewrap .coach-dn b{color:#C9E23F;font-weight:600}
.homewrap .coach-acts{margin-top:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.homewrap .coach-acts .skip{color:#B7CDB9;font-size:12px;text-decoration:underline;text-underline-offset:3px}
.homewrap .coach-fin{text-align:center;padding:12px 0 4px}
.homewrap .coach-fin h2{font-family:var(--serif);font-size:21px;font-weight:500}
.homewrap .coach-fin p{font-size:12.5px;color:#CFE0CC;margin-top:5px}
.homewrap .coach-fin .skip{color:#B7CDB9;font-size:12px;text-decoration:underline;text-underline-offset:3px;display:inline-block;margin-top:8px}
.homewrap .queue{padding:12px 18px 14px;flex:1}
.homewrap .queue .qh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.homewrap .queue .qh .microlabel{color:var(--forest)}
.homewrap .queue .qh .streak{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:11px;color:var(--ink-soft)}
.homewrap .queue .qh .streak i{width:7px;height:7px;border-radius:50%;background:var(--lime)}
.homewrap .queue .qh .streak i.off{background:var(--well);border:1px solid var(--sage-line)}
.homewrap .qrow{display:grid;grid-template-columns:auto 1fr auto;gap:11px;padding:9px 0;border-top:1px solid var(--sage-soft);align-items:start}
.homewrap .qrow:first-of-type{border-top:none}
.homewrap .qrow .pri{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;margin-top:1px;background:var(--well);color:var(--ink-soft)}
.homewrap .qrow.session .pri{background:var(--mint);color:var(--forest)}
.homewrap .qrow.now .pri{background:var(--lime);color:var(--lime-ink)}
.homewrap .qrow.done .pri{background:var(--forest);color:#fff}
.homewrap .qrow.done .t{text-decoration:line-through;color:var(--ink-soft)}
.homewrap .qrow .t{font-size:13px;font-weight:500;line-height:1.35}
.homewrap .qrow.now .t{font-weight:600}
.homewrap .qrow .m{font-size:11px;color:var(--ink-soft);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.homewrap .qrow .why-tag{background:var(--well);border-radius:99px;padding:1px 8px;font-weight:600}
.homewrap .qrow .sess{font-size:10px;font-weight:700;color:var(--forest);background:var(--mint);border-radius:99px;padding:1px 7px}
.homewrap .qfoot{margin-top:8px;font-size:11.5px;color:var(--ink-soft)}
.homewrap .kpis{display:grid;grid-template-columns:repeat(4,1fr);padding:14px 6px 4px}
.stage.mobile .homewrap .kpis{grid-template-columns:repeat(2,1fr)}
.homewrap .kpi{padding:4px 14px;border-right:1px solid var(--sage-line)}
.homewrap .kpi:last-child{border-right:none}
.stage.mobile .homewrap .kpi:nth-child(2){border-right:none}
.homewrap .kpi .n{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--forest);line-height:1.1}
.homewrap .kpi .l{font-size:11px;color:var(--ink-soft);margin-top:2px}
.homewrap .kpi .d{font-size:11px;font-weight:600;margin-top:3px}
.homewrap .kpi .d.up{color:var(--lime-ink)}
.homewrap .kpi .d.flat{color:var(--ink-soft)}
.homewrap .chartwrap{padding:8px 16px 0}
.homewrap .chartwrap svg{width:100%;height:auto;display:block}
.homewrap .chartfoot{display:flex;gap:14px;padding:8px 18px 12px;font-size:11px;color:var(--ink-soft);align-items:center;flex-wrap:wrap}
.homewrap .chartfoot .key{display:inline-flex;align-items:center;gap:6px}
.homewrap .chartfoot .key i{width:14px;height:3px;border-radius:2px;background:var(--forest)}
.homewrap .chartfoot .ev{margin-left:auto}
.homewrap .perf .readline{padding:0 18px 14px;font-size:12.5px;color:var(--ink-soft);border-top:1px solid var(--sage-soft);padding-top:10px;margin:0 0}
.homewrap .perf .readline b{color:var(--ink)}
.homewrap .srctabs{display:flex;gap:4px;padding:8px 14px 0;flex-wrap:wrap;border-bottom:1px solid var(--sage-soft);margin:0 4px}
.homewrap .srctabs button{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-soft);padding:8px 11px 9px;border-bottom:2px solid transparent;margin-bottom:-1px}
.homewrap .srctabs button:hover{color:var(--ink)}
.homewrap .srctabs button.on{color:var(--forest);border-bottom-color:var(--forest)}
.homewrap .srctabs button.off{color:var(--ink-soft);font-weight:500}
.homewrap .srctabs .dot{width:7px;height:7px;border-radius:50%}
.homewrap .srctabs .dot.ok{background:var(--lime);box-shadow:0 0 0 3px #C9E23F33}
.homewrap .srctabs .dot.no{border:1.5px dashed var(--sage);background:transparent}
.homewrap .srctabs .cx{font-size:10px;font-weight:700;color:var(--forest);background:var(--mint);border-radius:99px;padding:1px 7px}
.homewrap .srcpane{display:none}
.homewrap .srcpane.on{display:block}
.homewrap .kpis-click .kpi{text-align:left;border-radius:10px;transition:background .15s}
.homewrap .kpis-click .kpi:hover{background:var(--mint)}
.homewrap .kpis-click .kpi.on{background:var(--mint)}
.homewrap .kpis-click .kpi.on .l::after{content:" · charted";font-weight:700;color:var(--forest)}
.homewrap .kpis.ghost .kpi .n{color:var(--sage)}
.homewrap .kpis.ghost .kpi .l{color:var(--sage)}
.homewrap .perfgrid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:0;padding:6px 0 4px}
.stage.mobile .homewrap .perfgrid{grid-template-columns:1fr}
.homewrap .perfgrid .chartwrap{padding:6px 16px 8px}
.homewrap .perfgrid .side{border-left:1px solid var(--sage-soft);padding:8px 16px 10px}
.stage.mobile .homewrap .perfgrid .side{border-left:none;border-top:1px solid var(--sage-soft)}
.homewrap .sh{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.homewrap .bar{display:grid;grid-template-columns:52px 1fr 34px;gap:8px;align-items:center;font-size:11.5px;padding:3px 0}
.homewrap .bar span{color:var(--ink-soft)}
.homewrap .bar .b{height:9px;border-radius:5px;background:var(--well);position:relative}

/* ===== objects-in-order sidebar ===== */
.loopnav{position:relative;padding-left:14px}
.loopnav::before{content:"";position:absolute;left:5px;top:10px;bottom:34px;width:2px;background:var(--sage-line);border-radius:2px}
.loopnav button{position:relative}
.loopnav button::before{content:"";position:absolute;left:-13px;top:50%;width:8px;height:8px;border-radius:50%;background:var(--sage);transform:translateY(-50%);border:2px solid var(--card)}
.loopnav button.here::before{background:var(--forest)}
.loopnav button.hasct::before{background:var(--lime);box-shadow:0 0 0 3px #C9E23F44}
.loopnav .back{font-size:10.5px;color:var(--ink-soft);padding:6px 10px 2px;display:flex;gap:6px;align-items:center}
.loopnav .back i{font-style:normal;color:var(--sage)}
.nav button .ct.none{background:var(--well);color:var(--ink-soft)}
.nav button .ct.hot{animation:pop .3s ease}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
/* ===== flow bar ===== */
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--card);border:1px solid var(--sage-line);border-radius:14px;padding:8px 10px}

.flow button:hover{background:var(--mint);color:var(--forest)}
.flow button.here{background:var(--forest);color:#fff}
.flow button .n{font-size:10px;font-weight:700;background:var(--lime);color:var(--lime-ink);border-radius:99px;padding:1px 6px}

.stage.mobile .flow .from{display:none}
.rowdone td{opacity:.55}

        <p>Crazing happens when the glaze shrinks more than the clay body as the piece cools. The glaze is under tension, and tension finds a way out. Three things control that mismatch — and you control all three: your <span class="il">glaze recipe</span>, your <span class="il">firing schedule</span>, and how you cool.</p>
