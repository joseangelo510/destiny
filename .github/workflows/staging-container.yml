name: staging-container

on:
  push:
    branches: [container-staging]

concurrency:
  group: staging-container
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  RELEASE_SHA: fc7f050e1201ff5ee6ebece98560592257de127f
  RELEASE_TAG: step-zero-v1.1
  SITE_URL: https://destiny-staging-stepzero.fly.dev
  IMAGE_DIGEST: sha256:b17e68b2dbf120a6736d0fbe60c5a3f74828f9dfcadb7316cd4ac2800e82ac24
  FLY_APP: destiny-staging-stepzero
  FLY_REGION: sjc

jobs:
  build:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    environment: staging
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Assert trigger branch
        run: test "${{ github.ref }}" = "refs/heads/container-staging"

      - name: Checkout wrapper branch
        uses: actions/checkout@v4

      - name: Checkout immutable release evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: release
          fetch-depth: 1

      - name: Checkout release tag into src
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: src
          fetch-depth: 0
          fetch-tags: true

      - name: Source provenance
        working-directory: src
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git cat-file -t $RELEASE_TAG)" = "tag"
          test "$(git rev-parse $RELEASE_TAG^{})" = "$RELEASE_SHA"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          test -z "$(git status --porcelain)"
          echo "SRC_HEAD=$(git rev-parse HEAD)"
          echo "SRC_TAG=$(git describe --tags --exact-match HEAD)"

      - name: Assert staging Supabase URL
        run: echo "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" | grep -q titjatewvcjiuhisoppp

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          build-args: |
            GIT_SHA=${{ env.RELEASE_SHA }}
            RELEASE_TAG=${{ env.RELEASE_TAG }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          tags: |
            ghcr.io/joseangelo510/destiny-staging:${{ env.RELEASE_TAG }}
            ghcr.io/joseangelo510/destiny-staging:${{ env.RELEASE_SHA }}

      - name: Record image evidence
        run: |
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect ghcr.io/joseangelo510/destiny-staging@${{ steps.build.outputs.digest }} --raw > manifest.json
          docker buildx imagetools inspect ghcr.io/joseangelo510/destiny-staging@${{ steps.build.outputs.digest }} > inspect.txt
          echo "${{ steps.build.outputs.digest }}" > digest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: staging-evidence-${{ github.run_id }}
          path: |
            digest.txt
            manifest.json
            inspect.txt

  deploy:
    if: ${{ true }}
    runs-on: ubuntu-24.04
    environment: staging
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Assert trigger branch
        run: test "${{ github.ref }}" = "refs/heads/container-staging"

      - name: Checkout wrapper branch
        uses: actions/checkout@v4

      - name: Checkout release tree for QA inventory
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: release
          fetch-depth: 1

      - name: Assert release tree and QA inventory
        working-directory: release
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -f destiny-product/qa/inventory/routes.json
          jq -e 'type == "array" and length > 0' destiny-product/qa/inventory/routes.json > /dev/null
          echo "routes=$(jq 'length' destiny-product/qa/inventory/routes.json)"

      - name: Assert immutable Fly configuration
        run: |
          grep -q '^app = "destiny-staging-stepzero"$' fly.toml
          grep -q '^primary_region = "sjc"$' fly.toml
          grep -q 'path = "/_next/static/build-sha.txt"' fly.toml

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Authenticate Fly registry
        run: flyctl auth docker

      - name: Inspect approved candidate digest
        run: |
          docker buildx imagetools inspect "ghcr.io/joseangelo510/destiny-staging@${IMAGE_DIGEST}" > ghcr-inspect.txt

      - name: Ensure disposable Fly app exists
        run: |
          flyctl apps list --json \
            | jq -e --arg app "${FLY_APP}" 'any(.[]; (.Name // .name) == $app)' > /dev/null || \
            flyctl apps create "${FLY_APP}" --org personal --yes

      - name: Copy exact digest to Fly registry
        run: |
          docker buildx imagetools create \
            --tag "registry.fly.io/${FLY_APP}:step-zero-v1.1" \
            "ghcr.io/joseangelo510/destiny-staging@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "registry.fly.io/${FLY_APP}:step-zero-v1.1" > fly-inspect.txt
          grep -q "${IMAGE_DIGEST}" fly-inspect.txt

      - name: Stage runtime secrets
        run: |
          flyctl secrets set --stage --app "${FLY_APP}" \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            SESSION_SECRET="${{ secrets.SESSION_SECRET }}"

      - name: Deploy approved digest only
        run: |
          flyctl deploy \
            --app "${FLY_APP}" \
            --image "registry.fly.io/${FLY_APP}@${IMAGE_DIGEST}" \
            --ha=false \
            --strategy immediate \
            --wait-timeout 5m

      - name: Capture runtime evidence
        run: |
          flyctl status --app "${FLY_APP}" --json > status.json
          flyctl machines list --app "${FLY_APP}" --json > machines.json
          READY=0
          for i in $(seq 1 30); do
            SHA=$(curl -sS --max-time 5 "${SITE_URL}/_next/static/build-sha.txt" || true)
            TAG=$(curl -sS --max-time 5 "${SITE_URL}/_next/static/build-tag.txt" || true)
            if [ "$SHA" = "${RELEASE_SHA}" ] && [ "$TAG" = "${RELEASE_TAG}" ]; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" = "1"
          echo "ready after $i attempts"
          flyctl checks list --app "${FLY_APP}" | tee checks.txt | grep -qi passing
          sleep 10
          flyctl logs --app "${FLY_APP}" --no-tail > runtime.log
          grep "DESTINY_BUILD_SHA=${RELEASE_SHA}" runtime.log
          grep "DESTINY_BUILD_TAG=${RELEASE_TAG}" runtime.log
          grep -q "Ready" runtime.log
          curl --fail --silent --show-error --location --output root.html --write-out '%{http_code}\n' "${SITE_URL}/" | tee root-status.txt
          test "$(cat root-status.txt)" = "200"
          curl --fail --silent --show-error "${SITE_URL}/_next/static/build-sha.txt" | tee build-sha.txt
          curl --fail --silent --show-error "${SITE_URL}/_next/static/build-tag.txt" | tee build-tag.txt
          test "$(cat build-sha.txt)" = "${RELEASE_SHA}"
          test "$(cat build-tag.txt)" = "${RELEASE_TAG}"

      - name: Sweep every inventoried route without authentication
        run: |
          jq -r '.[].route' release/destiny-product/qa/inventory/routes.json \
            | sed 's/\[id\]/00000000-0000-0000-0000-000000000000/g' \
            | sort -u > route-paths.txt
          printf '%s\n' '/_next/static/build-sha.txt' '/_next/static/build-tag.txt' >> route-paths.txt
          sort -u -o route-paths.txt route-paths.txt
          test "$(wc -l < route-paths.txt | tr -d ' ')" = "78"
          : > route-sweep.tsv
          while IFS= read -r route; do
            safe_name="$(printf '%s' "$route" | tr '/?&=[]' '_______')"
            code="$(curl --silent --show-error --location --max-redirs 5 \
              --output "route-${safe_name}.body" --write-out '%{http_code}' "${SITE_URL}${route}")"
            printf '%s\t%s\n' "$code" "$route" | tee -a route-sweep.tsv
            test "$code" -lt 500
          done < route-paths.txt
          grep -q $'\t/api/content/word$' route-sweep.tsv

      - name: Observe 30-minute staging stability window
        run: |
          : > stability.tsv
          for minute in $(seq 0 30); do
            timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            root_code="$(curl --silent --show-error --location --max-redirs 5 \
              --output /dev/null --write-out '%{http_code}' "${SITE_URL}/")"
            stamp="$(curl --fail --silent --show-error "${SITE_URL}/_next/static/build-sha.txt")"
            machine_count="$(flyctl machines list --app "${FLY_APP}" --json | jq '[.[] | select(.state == "started")] | length')"
            printf '%s\t%s\t%s\t%s\n' "$timestamp" "$root_code" "$stamp" "$machine_count" | tee -a stability.tsv
            test "$root_code" -lt 500
            test "$stamp" = "${RELEASE_SHA}"
            test "$machine_count" = "1"
            if [ "$minute" -lt 30 ]; then sleep 60; fi
          done
          flyctl machines list --app "${FLY_APP}" --json > machines-after-30m.json
          flyctl logs --app "${FLY_APP}" --no-tail > runtime-after-30m.log
          grep -q "${RELEASE_SHA}" runtime-after-30m.log

      - name: Upload deploy evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-evidence-${{ github.run_id }}
          path: |
            ghcr-inspect.txt
            fly-inspect.txt
            status.json
            machines.json
            checks.txt
            runtime.log
            root-status.txt
            root.html
            build-sha.txt
            build-tag.txt
            route-paths.txt
            route-sweep.tsv
            route-*.body
            stability.tsv
            machines-after-30m.json
            runtime-after-30m.log
          if-no-files-found: warn
