name: Destiny test harness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: destiny-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: harness-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: destiny-product

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm 11.9.0
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: destiny-product/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the complete Destiny harness
        run: pnpm gate

      - name: Record immutable PR evidence
        if: success()
        run: |
          mkdir -p qa/artifacts/governance
          printf '%s\n' "${GITHUB_SHA}" | tee qa/artifacts/governance/build-sha.txt
          test "$(cat qa/artifacts/governance/build-sha.txt)" = "${GITHUB_SHA}"
          printf 'full_gate=pass\nvitest=pass\neslint=pass\nplaywright=pass\nzero_5xx=pass\n' \
            | tee qa/artifacts/governance/harness-results.txt

      - name: Preserve green harness evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: destiny-harness-evidence-${{ github.run_id }}
          path: destiny-product/qa/artifacts/governance/
          if-no-files-found: error
          retention-days: 30

      - name: Destroy disposable Supabase isolation stack
        if: always()
        continue-on-error: true
        run: pnpm exec supabase stop --no-backup

      - name: Preserve browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: destiny-playwright-failure-${{ github.run_id }}
          path: destiny-product/qa/artifacts/
          if-no-files-found: ignore
          retention-days: 14
