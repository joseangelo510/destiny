name: Destiny policy guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: destiny-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy-guard:
    name: policy-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact PR commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enforce Destiny classification, frozen paths, and label authority
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node destiny-product/scripts/governance-policy.mjs policy
