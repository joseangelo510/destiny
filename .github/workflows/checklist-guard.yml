name: Destiny checklist guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: destiny-checklist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checklist-guard:
    name: checklist-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact PR commit
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Require complete classification and verifiable evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node destiny-product/scripts/governance-policy.mjs checklist
