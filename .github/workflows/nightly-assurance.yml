name: Destiny nightly assurance

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: destiny-product
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: destiny-product/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run traced quality, coverage, RED replay, and mutation assurance
        run: pnpm qa:harness-v2
      - name: Classify repeated browser journeys without retries
        run: pnpm exec playwright test qa/e2e/links.spec.ts --repeat-each=2
      - name: Preserve complete assurance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: destiny-nightly-assurance-${{ github.run_id }}
          path: destiny-product/qa/artifacts/
          if-no-files-found: error
          retention-days: 30
